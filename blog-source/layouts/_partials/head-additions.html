{{/* Detroit Automation Academy — blog-wide SEO additions.
     Canonical, robots, Twitter card, and JSON-LD structured data.
     .IsPage = single post (Article); otherwise the section/home (Blog). */}}
<link rel="canonical" href="{{ .Permalink }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }} — Detroit Automation Academy">
{{ with .Description }}<meta name="twitter:description" content="{{ . }}">{{ end }}
<meta name="twitter:image" content="https://www.detroitautomationacademy.com/assets/logo.webp">
{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  {{ with .Description }}"description": {{ . | jsonify }},{{ end }}
  "url": {{ .Permalink | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05-07:00" | jsonify }},
  {{ with .Lastmod }}"dateModified": {{ .Format "2006-01-02T15:04:05-07:00" | jsonify }},{{ end }}
  "author": {"@type": "Organization", "name": "Detroit Automation Academy", "url": "https://www.detroitautomationacademy.com/"},
  "publisher": {"@type": "Organization", "name": "Detroit Automation Academy", "url": "https://www.detroitautomationacademy.com/", "logo": "https://www.detroitautomationacademy.com/assets/logo.webp"}
}
</script>
{{ else }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": {{ .Title | jsonify }},
  "url": {{ .Permalink | jsonify }},
  "publisher": {"@type": "Organization", "name": "Detroit Automation Academy", "url": "https://www.detroitautomationacademy.com/"}
}
</script>
{{ end }}
