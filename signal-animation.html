<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#07111b" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet" />
  <title>The Signal Logo Animation</title>
  <style>
    :root {
      color-scheme: light dark;
      --sky-top: #000000;
      --sky-mid: #020508;
      --sky-low: #070c10;
      --ink: #000000;
      --building-near: #05090d;
      --building-far: #0b151d;
      --window: #d6aa62;
      --beam-core: rgba(220, 241, 245, .72);
      --beam-edge: rgba(151, 200, 211, .08);
      --disc: rgba(211, 234, 237, .96);
      --disc-edge: rgba(189, 225, 230, .34);
      --mist: rgba(120, 159, 170, .16);
      --copy: #dbe7e9;
      --muted: #8ca0a6;
      --control: rgba(3, 10, 15, .62);
      --control-line: rgba(215, 237, 240, .2);
      --amber: #ff9a1f;
      --circuit-hot: #ffd36b;
      --circuit-glow: rgba(255, 154, 31, .92);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --sky-top: #000000;
        --sky-mid: #020508;
        --sky-low: #080d11;
        --building-far: #0a1014;
        --building-near: #020406;
        --disc: rgba(5, 7, 8, .98);
        --beam-core: rgba(229, 247, 248, .76);
        --copy: #eef7f7;
        --muted: #abc0c5;
      }
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--sky-top);
      color: var(--copy);
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    }

    button { font: inherit; }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 22% 20%, rgba(55, 76, 86, .08), transparent 25%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 62%, var(--sky-low) 100%);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: .23;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      background-repeat: repeat;
      background-size: 270px 190px;
      opacity: .45;
      background-image:
        radial-gradient(circle at 22px 33px, rgba(223,240,242,.9) 0 1px, transparent 1.4px),
        radial-gradient(circle at 122px 75px, rgba(223,240,242,.7) 0 .7px, transparent 1px),
        radial-gradient(circle at 225px 18px, rgba(223,240,242,.55) 0 .8px, transparent 1.2px),
        radial-gradient(circle at 202px 143px, rgba(223,240,242,.45) 0 .7px, transparent 1px);
    }
    .stars::before { transform: translate(73px, 41px) scale(.8); opacity: .28; }
    .stars::after { transform: translate(-42px, 89px) scale(1.15); opacity: .17; }

    .cloud {
      position: absolute;
      z-index: 2;
      width: 52vw;
      height: 10vw;
      min-height: 60px;
      border-radius: 50%;
      background: rgba(88, 116, 127, .09);
      filter: blur(22px);
      opacity: .8;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .cloud.a { top: 21%; left: -15%; }
    .cloud.b { top: 37%; right: -20%; animation-duration: 24s; animation-direction: alternate-reverse; }

    .signal {
      position: absolute;
      z-index: 8;
      left: clamp(5%, 13vw, 17%);
      top: clamp(10%, 13vh, 17%);
      width: clamp(170px, 28vw, 410px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--ink);
      background:
        radial-gradient(circle at 47% 44%, #020202 0 48%, var(--disc) 66%, rgba(15, 20, 22, .88) 75%, transparent 77%);
      box-shadow:
        0 0 0 1px rgba(255, 154, 31, .2),
        0 0 28px rgba(255, 154, 31, .22),
        0 0 78px rgba(147, 202, 211, .12);
      opacity: 0;
      transform: scale(.74);
      filter: blur(9px);
      animation: signal-lock 8.5s cubic-bezier(.22,.75,.18,1) infinite;
    }

    .signal::before {
      content: "";
      position: absolute;
      inset: -13%;
      border-radius: inherit;
      border: 1px solid rgba(207, 236, 239, .12);
      box-shadow: inset 0 0 32px rgba(221, 242, 243, .06);
    }

    .monogram-wrap {
      position: relative;
      width: 74%;
      height: 74%;
      transform: rotate(-1deg);
      filter: drop-shadow(0 0 8px rgba(255, 99, 12, .34));
      user-select: none;
    }

    .monogram {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .circuit-energy {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      filter: drop-shadow(0 0 6px var(--circuit-glow));
    }

    .circuit-trace {
      fill: none;
      stroke: var(--circuit-hot);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 22 520;
      stroke-dashoffset: 0;
      opacity: .92;
      animation: circuit-flow 2.4s linear infinite;
    }
    .circuit-trace:nth-child(2) { animation-delay: -.8s; }
    .circuit-trace:nth-child(3) { animation-delay: -1.6s; }
    .circuit-trace:nth-child(4) { animation-delay: -2s; }

    .circuit-node {
      fill: #ffe4a4;
      stroke: var(--amber);
      stroke-width: 9;
      transform-box: fill-box;
      transform-origin: center;
      animation: circuit-node 1.2s ease-in-out infinite alternate;
    }
    .circuit-node:nth-of-type(2n) { animation-delay: -.55s; }

    .beam-wrap {
      position: absolute;
      z-index: 7;
      right: clamp(-20px, 4vw, 80px);
      bottom: clamp(90px, 13vh, 150px);
      width: min(102vw, 1380px);
      height: min(97vh, 990px);
      transform-origin: 92% 96%;
      animation: sweep 8.5s cubic-bezier(.55,.02,.32,1) infinite;
      pointer-events: none;
    }

    .beam {
      position: absolute;
      inset: 0;
      clip-path: polygon(2% 0, 21% 4%, 95% 96%, 88% 100%);
      background: linear-gradient(94deg, var(--beam-edge), var(--beam-core) 12%, rgba(190,224,229,.33) 21%, rgba(143,190,199,.035) 73%);
      filter: blur(7px);
      mix-blend-mode: screen;
      opacity: .78;
    }
    .beam::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(105deg, transparent 0 7%, rgba(230,247,248,.035) 7.5%, transparent 8% 14%);
      animation: flicker .13s steps(2,end) infinite;
    }

    .skyline {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: clamp(225px, 40vh, 430px);
      display: block;
    }

    .windows { animation: window-breathe 5s ease-in-out infinite alternate; }

    .fog {
      position: absolute;
      z-index: 11;
      left: -15%;
      right: -15%;
      bottom: 14%;
      height: 80px;
      background: linear-gradient(180deg, transparent, var(--mist), transparent);
      filter: blur(14px);
      animation: fog-shift 16s ease-in-out infinite alternate;
    }

    .searchlight {
      position: absolute;
      z-index: 13;
      right: clamp(20px, 8vw, 130px);
      bottom: clamp(38px, 7vh, 70px);
      width: clamp(82px, 10vw, 132px);
      aspect-ratio: 1.2;
      transform: rotate(-26deg);
      transform-origin: 56% 80%;
      animation: lamp-sweep 8.5s cubic-bezier(.55,.02,.32,1) infinite;
    }
    .lamp-head {
      position: absolute;
      left: 4%; top: 8%;
      width: 70%; height: 55%;
      border-radius: 52% 18% 18% 52%;
      background: linear-gradient(145deg, #3e4b50, #10181c 48%, #05090b);
      border: 1px solid rgba(223,241,242,.18);
      box-shadow: inset 8px 6px 12px rgba(255,255,255,.07), 5px 8px 16px rgba(0,0,0,.45);
    }
    .lamp-head::before {
      content: "";
      position: absolute;
      left: -8%; top: 4%;
      width: 28%; height: 90%;
      border-radius: 50%;
      background: #dff4f3;
      box-shadow: 0 0 20px rgba(221,245,244,.8);
    }
    .lamp-yoke {
      position: absolute;
      left: 41%; top: 48%;
      width: 42%; height: 34%;
      border: 7px solid #151f23;
      border-top: 0;
      border-radius: 0 0 16px 16px;
    }
    .lamp-base {
      position: absolute;
      left: 45%; top: 78%;
      width: 52%; height: 16%;
      border-radius: 45% 45% 12% 12%;
      background: linear-gradient(#263239, #080d10);
      box-shadow: 0 7px 0 #05080a;
    }

    .interface {
      position: absolute;
      z-index: 30;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      color: var(--copy);
      background: var(--control);
      border: 1px solid var(--control-line);
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      letter-spacing: .09em;
      text-transform: uppercase;
      font-size: 13px;
      font-weight: 600;
    }
    .control:hover { background: rgba(15,29,37,.82); border-color: rgba(219,239,240,.38); }
    .control:focus-visible { outline: 2px solid var(--disc); outline-offset: 3px; }
    .control svg { width: 15px; height: 15px; fill: currentColor; }

    .status {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-shadow: 0 1px 3px #000;
    }
    .status::before {
      content: "";
      display: inline-block;
      width: 5px; height: 5px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
      animation: status-pulse 1.6s ease-in-out infinite;
    }

    .stage.paused *, .stage.paused *::before, .stage.paused *::after { animation-play-state: paused !important; }

    @keyframes sweep {
      0% { transform: rotate(18deg); opacity: 0; }
      6% { opacity: .56; }
      20% { transform: rotate(7deg); opacity: .78; }
      39%, 72% { transform: rotate(-7deg); opacity: 1; }
      85% { transform: rotate(-17deg); opacity: .48; }
      100% { transform: rotate(-23deg); opacity: 0; }
    }
    @keyframes lamp-sweep {
      0% { transform: rotate(-7deg); }
      20% { transform: rotate(-19deg); }
      39%, 72% { transform: rotate(-33deg); }
      100% { transform: rotate(-48deg); }
    }
    @keyframes signal-lock {
      0%, 27% { opacity: 0; transform: scale(.76); filter: blur(11px); }
      38% { opacity: .42; transform: scale(.91); filter: blur(4px); }
      46%, 70% { opacity: 1; transform: scale(1); filter: blur(0); }
      78% { opacity: .18; transform: scale(.92); filter: blur(7px); }
      100% { opacity: 0; transform: scale(.8); filter: blur(11px); }
    }
    @keyframes drift { to { transform: translateX(22vw) scale(1.08); } }
    @keyframes fog-shift { to { transform: translateX(10%); opacity: .62; } }
    @keyframes flicker { 0% { opacity: .55; } 100% { opacity: 1; } }
    @keyframes window-breathe { to { opacity: .66; } }
    @keyframes status-pulse { 50% { opacity: .35; box-shadow: 0 0 2px var(--amber); } }
    @keyframes circuit-flow { to { stroke-dashoffset: -542; } }
    @keyframes circuit-node {
      from { opacity: .28; transform: scale(.66); }
      to { opacity: 1; transform: scale(1.2); }
    }

    @media (max-width: 680px) {
      .signal {
        left: 8%;
        top: 16%;
        width: min(54vw, 260px);
      }
      .beam-wrap {
        right: -29vw;
        bottom: 83px;
        width: 145vw;
        height: 78vh;
      }
      .searchlight { right: 7vw; bottom: 70px; }
      .skyline { height: 34vh; min-height: 235px; }
      .cloud { width: 85vw; height: 18vw; }
      .status { display: none; }
      @keyframes sweep {
        0% { transform: rotate(15deg); opacity: 0; }
        8% { opacity: .5; }
        22% { transform: rotate(4deg); opacity: .76; }
        39%, 72% { transform: rotate(-8deg); opacity: 1; }
        87% { transform: rotate(-18deg); opacity: .4; }
        100% { transform: rotate(-23deg); opacity: 0; }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
      .signal { opacity: 1; transform: scale(1); filter: none; }
      .beam-wrap { transform: rotate(-7deg); opacity: 1; }
      .searchlight { transform: rotate(-33deg); }
      .circuit-trace { stroke-dasharray: none; opacity: .72; }
      .circuit-node { opacity: .9; transform: none; }
      .status::after { content: " · still frame"; }
    }
  </style>
</head>

    <div class="fog" aria-hidden="true"></div>

    <svg class="skyline" viewBox="0 0 1440 430" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--building-far)" />
          <stop offset="1" stop-color="var(--building-near)" />
        </linearGradient>
        <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0a1014" />
          <stop offset="1" stop-color="#020406" />
        </linearGradient>
        <pattern id="windowGrid" width="34" height="31" patternUnits="userSpaceOnUse">
          <rect x="8" y="8" width="5" height="8" rx="1" fill="var(--window)" opacity=".6" />
          <rect x="21" y="8" width="5" height="8" rx="1" fill="#87a9ac" opacity=".2" />
        </pattern>
      </defs>
      <g fill="url(#far)">
        <path d="M0 430V230h75v-45h70v245zm145 0V275h100v-64h72v219zm155 0V250h80v-97h18v-29h11v29h24v97h82v180zm155 0V293h68v-80h93v217zm133 0V246h41v-38h65v38h70v184zm147 0V267h78v-93h32v-54h18v54h44v93h57v163zm170 0V215h92v-56h65v271zm130 0V275h67v-86h91v241zm137 0V240h68v190z" />
      </g>
      <g class="windows" fill="url(#windowGrid)" opacity=".75">
        <path d="M16 246h114v184H16zM165 292h134v138H165zM326 266h172v164H326zM608 264h140v166H608zM755 286h190v144H755zM980 236h160v194H980zM1161 292h182v138h-182z" />
      </g>
      <g fill="url(#near)">
        <path d="M0 430V340h190v-72h25v-24h15v24h132v162zm288 0V331h138v-42h20v42h86v99zm188 0V356h178v-31h18v31h85v74zm238 0V305h187v-37h35v37h77v125zm242 0V344h132v-96h126v182zm216 0V315h268v115z" />
        <path d="M1055 252h28v-22h9v-72h5v72h9v22h29v178h-80z" />
      </g>
      <g stroke="#05090c" stroke-width="7" fill="none">
        <path d="M86 340v-90m-26 0h57M1198 248v-88m-31 0h61" />
      </g>
      <rect y="418" width="1440" height="12" fill="#010304" />
    </svg>

    <div class="searchlight" aria-hidden="true">
      <div class="lamp-head"></div>
      <div class="lamp-yoke"></div>
      <div class="lamp-base"></div>
    </div>

    <div class="interface">
      <button class="control" id="replay" type="button" aria-label="Replay spotlight animation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.32 10H3.58A9 9 0 1 0 6 5.5V2L1 7l5 5V8.17A6.97 6.97 0 0 1 12 5Z"/></svg>
        Replay
      </button>
      <button class="control" id="pause" type="button" aria-label="Pause spotlight animation" aria-pressed="false">
        <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
        <span>Pause</span>
      </button>
      <span class="status" aria-live="polite">Searching skyline</span>
    </div>
  </main>

  <script>
    (function () {
      var stage = document.getElementById('stage');
      var replay = document.getElementById('replay');
      var pause = document.getElementById('pause');
      var pauseLabel = pause.querySelector('span');
      var pauseIcon = pause.querySelector('svg');
      var status = document.querySelector('.status');
      var timers = [];

      function setStatusTimeline() {
        timers.forEach(clearTimeout);
        timers = [];
        status.textContent = 'Searching skyline';
        timers.push(setTimeout(function () { status.textContent = 'Signal acquired'; }, 3300));
        timers.push(setTimeout(function () { status.textContent = 'Holding signal'; }, 4300));
        timers.push(setTimeout(function () { status.textContent = 'Searching skyline'; }, 6800));
      }

      function restart() {
        stage.classList.remove('paused');
        pause.setAttribute('aria-pressed', 'false');
        pause.setAttribute('aria-label', 'Pause spotlight animation');
        pauseLabel.textContent = 'Pause';
        pauseIcon.innerHTML = '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';
        stage.style.display = 'none';
        void stage.offsetWidth;
        stage.style.display = '';
        setStatusTimeline();
      }

      replay.addEventListener('click', restart);
      pause.addEventListener('click', function () {
        var isPaused = stage.classList.toggle('paused');
        pause.setAttribute('aria-pressed', String(isPaused));
        pause.setAttribute('aria-label', isPaused ? 'Resume spotlight animation' : 'Pause spotlight animation');
        pauseLabel.textContent = isPaused ? 'Resume' : 'Pause';
        pauseIcon.innerHTML = isPaused
          ? '<path d="M8 5v14l11-7z"/>'
          : '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';
      });

      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        setStatusTimeline();
        setInterval(setStatusTimeline, 8500);
      } else {
        status.textContent = 'Signal acquired';
      }
    }());
  </script>
</body>
</html>
